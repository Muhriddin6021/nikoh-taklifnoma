<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asliddin & Ruxshon — Nikoh taklifnomasi</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Georgia,serif;background:linear-gradient(135deg,#fff8f0,#f9e8e8);color:#4b3030}
.card{width:min(92%,430px);padding:30px 23px;text-align:center;border-radius:28px;background:#fffffff2;
box-shadow:0 12px 40px #50282825;border:1px solid #ead3d3}.top{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#9a6b6b}
h1{font-size:32px;margin:12px 0;color:#6f3e48}.heart{font-size:27px}.date{font-size:19px;font-weight:bold;margin-top:16px}
p{line-height:1.6;font-size:16px}.name{font-size:20px;font-weight:bold;color:#7b4853}
.location{margin:18px 0;padding:15px;border-radius:18px;background:#fff7f7;border:1px solid #ecd9d9}
.photo{width:175px;height:175px;margin:16px auto;border-radius:50%;overflow:hidden;border:5px solid #f0dddd;background:#f8eeee;
display:flex;align-items:center;justify-content:center;color:#a77b7b;font-size:14px}.photo img{width:100%;height:100%;object-fit:cover}
.btn,button{display:block;width:100%;margin:11px 0;padding:14px;border:0;border-radius:14px;font-size:15px;font-weight:bold}
.btn{text-decoration:none;background:#7b4853;color:white}button{background:#ead0d0;color:#5c3838}
.note{font-size:13px;color:#8b6d6d}
</style>
</head>
<body>
<main class="card">
<div class="top">Nikoh to‘yi</div>
<div class="photo"><img src="kelin-kuyov.jpg" alt="Asliddin va Ruxshon"
onerror="this.style.display='none';this.parentElement.textContent='Kelin-kuyov rasmi'"></div>
<div class="heart">♡</div>
<h1>Asliddin &amp; Ruxshon</h1>
<p>Aziz farzandlarimiz <span class="name">Asliddin va Ruxshon</span>ning nikoh to‘yiga Sizni samimiy taklif etamiz.</p>
<div class="date">18.08.2026</div><div>soat 19:00</div>
<div class="location"><b>Manzil</b><br>Navbahor tumani, Markaziy Beshrabo,<br>“Fazilat xonim” to‘yxonasi</div>
<a class="btn" href="https://maps.app.goo.gl/FUyQG1XF19YaEv7J8?g_st=atm" target="_blank">📍 Manzilni xaritada ko‘rish</a>
<button onclick="music()">🎵 Oshiqman taronasini tinglash</button>
<audio id="m" src="oshiq.mp3" loop></audio>
<p class="note">Hurmat bilan, Rajabova M.</p>
</main>
<script>function music(){let a=document.getElementById('m');a.paused?a.play():a.pause()}</script>
</body></html>
